name: Keep Render Awake

# 目的：Render 免费实例 15 分钟无请求即休眠，冷启动 30–60s。
# 每 10 分钟 ping 一次 /health，让它保持常驻。
# 仓库是 public，GitHub Actions 定时任务不消耗付费分钟数。

on:
  schedule:
    # 每 10 分钟一次。注意：GitHub 的 cron 在高负载时段可能延迟数分钟甚至跳过，
    # 这是平台行为，无法保证严格准点。若发现仍会休眠，改用 cron-job.org（见 README 说明）。
    - cron: '*/10 * * * *'
  # 支持在 Actions 页面手动触发一次，用于验证配置
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping /health
        env:
          BASE_URL: https://sswixa-blogs.onrender.com
        run: |
          set -u
          # 冷启动可能超过 60s，给足超时并重试
          for i in 1 2 3 4; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 100 "$BASE_URL/health" || true)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "::notice::Render 实例在线，保活成功"
              exit 0
            fi
            sleep 20
          done
          echo "::error::连续 4 次请求失败，Render 实例可能未启动或域名不可达"
          exit 1
